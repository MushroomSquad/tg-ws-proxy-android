name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v1.1.0); leave empty to use github.ref_name"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          sdkmanager --list_installed | grep -E 'ndk|cmake' || true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is required"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/tgwsproxy.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore/tgwsproxy.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Resolve version
        id: ver
        run: |
          REF="${{ github.event.inputs.tag }}"
          if [ -z "$REF" ]; then
            REF="${{ github.ref_name }}"
          fi
          VERSION="${REF#v}"
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_OUT="TgWsProxy-Android-${VERSION}.apk"
          cp "$APK_SRC" "$APK_OUT"
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TgWsProxy Android ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.ver.outputs.apk }}
          body: |
            ## TgWsProxy Android ${{ steps.ver.outputs.version }}

            Local MTProto WebSocket proxy for Telegram Android, with optional ByeDPI VPN.

            - **Obtainium**: add GitHub repo `MushroomSquad/tg-ws-proxy-android`, APK filter `\.apk$`
            - Docs: [README](https://github.com/MushroomSquad/tg-ws-proxy-android#readme) · [RU](https://github.com/MushroomSquad/tg-ws-proxy-android/blob/main/README.ru.md)
            - [Disclaimer](https://github.com/MushroomSquad/tg-ws-proxy-android/blob/main/DISCLAIMER.md) · [Credits](https://github.com/MushroomSquad/tg-ws-proxy-android/blob/main/CREDITS.md) · [Notice](https://github.com/MushroomSquad/tg-ws-proxy-android/blob/main/NOTICE.md)

            Upstream idea: [Flowseal/tg-ws-proxy](https://github.com/Flowseal/tg-ws-proxy) (MIT). ByeDPI: [ByeDPIAndroid](https://github.com/dovecoteescapee/ByeDPIAndroid) (GPL-3.0).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
